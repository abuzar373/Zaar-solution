# Spin up a local PostgreSQL instance for development:
#   docker compose up -d
#
# Stop it with:            docker compose down
# Wipe all data and stop:  docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: abuzar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - abuzar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  abuzar_pgdata:
